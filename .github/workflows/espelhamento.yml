name: Espelhamento Automatico Vercel

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código original
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar para o repositório da Simples
        run: |
          git remote add clone https://admsimplescontabilrv-dev:${{ secrets.DESTINATION_TOKEN }}@github.com/admsimplescontabilrv-dev/AUTO-TERMOS-WEB.git
          git push clone main:main --force
