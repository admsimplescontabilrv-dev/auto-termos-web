name: Espelhamento Automatico Vercel

on:
  push:
    branches: [ main ] 

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código original
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviando para o repositório privado
        run: |
          # Configura a URL de destino com o Token e a conta da Simples Contábil
          git remote add clone https://admsimplescontabilrv-dev:${{ secrets.DESTINATION_TOKEN }}@github.com/admsimplescontabilrv-dev/auto-termos-web.git
          
          # Força o envio do código atualizado para o destino
          git push clone main --force
