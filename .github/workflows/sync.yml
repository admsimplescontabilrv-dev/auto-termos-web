name: Sincronizar com Conta B

# Isso diz ao GitHub: "Rode isso toda vez que houver um push na branch main"
on:
  push:
    branches: [ main ] 

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Pegando o código mais recente
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Enviando para a Conta B
        run: |
          # Substitua 'UsuarioContaB' e 'NomeDoRepoB' pelos dados reais da segunda conta
          git remote add destino https://UsuarioContaB:${{ secrets.DESTINATION_TOKEN }}@github.com/UsuarioContaB/NomeDoRepoB.git
          
          # Envia o código forçando a atualização
          git push destino main --force
